apiVersion: apps/v1
kind: Deployment

metadata:
  name: rds-jenkins
  labels:
    app: rds-jenkins

spec:
  replicas: 3

  selector:
    matchLabels:
      app: rds-jenkins

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: rds-jenkins

    spec:
      containers:
        - name: rds-jenkins

          image: YOUR_DOCKERHUB_USERNAME/rds-jenkins:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
